services:
  db:
    image: postgres:16-alpine
    container_name: soguk-cuzdan-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: soguk_payload
    volumes:
      - soguk_cuzdan_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d soguk_payload"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  soguk_cuzdan_pg:
